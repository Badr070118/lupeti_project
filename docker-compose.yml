services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lupeti
      POSTGRES_PASSWORD: lupeti
      POSTGRES_DB: lupeti
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lupeti']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://lupeti:lupeti@db:5432/lupeti?schema=public
      NODE_ENV: production
      UPLOADS_ROOT: /app/uploads
      UPLOADS_PUBLIC_BASE: /uploads
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web/public/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: /api/proxy
        NEXT_PUBLIC_APP_URL: http://localhost:3001
        NEXT_PUBLIC_SUPPORTED_LOCALES: fr
        NEXT_PUBLIC_DEFAULT_LOCALE: fr
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/proxy
      API_INTERNAL_URL: http://api:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_SUPPORTED_LOCALES: fr
      NEXT_PUBLIC_DEFAULT_LOCALE: fr
    ports:
      - '3001:3001'
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
